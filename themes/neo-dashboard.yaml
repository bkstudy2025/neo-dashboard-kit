Neo Dashboard:
  modes:
    dark:
      # ── Base background variables ─────────────────────────────
      background-color: "#06080F"
      background-color-2: "#0d1020"
      primary-background-color: "var(--background-color)"
      secondary-background-color: "var(--background-color-2)"
      markdown-code-background-color: "var(--background-color-2)"

      # ── Lovelace background (Aurora gradient) ─────────────────
      lovelace-background: >-
        radial-gradient(80% 60% at 20% 0%, #161d33 0%, rgba(7,9,15,0) 55%),
        radial-gradient(70% 50% at 100% 100%, #1a1426 0%, rgba(7,9,15,0) 55%),
        #06080F

      # ── Primary / accent colors ───────────────────────────────
      primary-color: "#7C9CFF"
      accent-color: "#7C9CFF"

      # ── Text ─────────────────────────────────────────────────
      text-color: "#F4F6FB"
      primary-text-color: "var(--text-color)"
      text-primary-color: "var(--text-color)"
      secondary-text-color: "rgba(244,246,251,0.72)"
      disabled-text-color: "rgba(244,246,251,0.30)"
      text-medium-color: "rgba(244,246,251,0.50)"
      sidebar-text-color: "var(--text-color)"

      # ── Cards ─────────────────────────────────────────────────
      ha-card-background: "#111827"
      card-background-color: "var(--ha-card-background)"
      ha-card-border-color: "rgba(255,255,255,0.08)"
      ha-card-border-width: "1px"
      ha-card-border-radius: "24px"
      ha-card-box-shadow: "0 18px 40px -16px rgba(0,0,0,0.55)"
      divider-color: "rgba(255,255,255,0.08)"
      border-color: "rgba(255,255,255,0.08)"
      grid-card-gap: "16px"

      # ── Sidebar ───────────────────────────────────────────────
      sidebar-background-color: "#0a0d18"
      sidebar-icon-color: "rgba(244,246,251,0.50)"
      sidebar-selected-icon-color: "#7C9CFF"
      sidebar-selected-text-color: "var(--text-color)"
      paper-listbox-background-color: "var(--sidebar-background-color)"
      light-primary-color: "var(--ha-card-background)"

      # ── Header ───────────────────────────────────────────────
      app-header-background-color: "rgba(6,8,15,0.85)"
      app-header-text-color: "var(--text-color)"
      app-header-selection-bar-color: "#7C9CFF"

      # ── State / icons ─────────────────────────────────────────
      state-icon-color: "rgba(244,246,251,0.50)"
      state-icon-active-color: "#7C9CFF"
      paper-item-icon-color: "rgba(244,246,251,0.50)"
      paper-item-icon-active-color: "#7C9CFF"

      # ── Switches ─────────────────────────────────────────────
      switch-checked-color: "#7C9CFF"
      switch-unchecked-color: "rgba(255,255,255,0.14)"
      switch-checked-button-color: "#ffffff"
      switch-unchecked-button-color: "#ffffff"
      switch-checked-track-color: "rgba(124,156,255,0.4)"
      switch-unchecked-track-color: "rgba(255,255,255,0.10)"
      paper-toggle-button-checked-bar-color: "#7C9CFF"

      # ── Sliders ──────────────────────────────────────────────
      slider-color: "#7C9CFF"
      paper-slider-knob-color: "#7C9CFF"
      paper-slider-active-color: "#7C9CFF"
      paper-slider-pin-color: "var(--background-color-2)"
      paper-slider-container-color: "rgba(255,255,255,0.10)"

      # ── Inputs / text fields ──────────────────────────────────
      input-fill-color: "var(--background-color-2)"
      input-ink-color: "var(--text-color)"
      input-label-ink-color: "rgba(244,246,251,0.50)"
      input-idle-line-color: "rgba(255,255,255,0.12)"
      input-hover-line-color: "rgba(255,255,255,0.20)"
      input-disabled-fill-color: "var(--background-color)"
      input-disabled-ink-color: "rgba(244,246,251,0.30)"
      input-disabled-label-ink-color: "rgba(244,246,251,0.30)"
      input-disabled-line-color: "rgba(255,255,255,0.06)"
      input-outlined-idle-border-color: "rgba(255,255,255,0.12)"
      input-outlined-hover-border-color: "rgba(255,255,255,0.20)"
      input-outlined-disabled-border-color: "rgba(255,255,255,0.06)"
      input-dropdown-icon-color: "rgba(244,246,251,0.50)"
      mdc-text-field-fill-color: "var(--background-color-2)"
      mdc-text-field-ink-color: "var(--text-color)"
      mdc-text-field-label-ink-color: "rgba(244,246,251,0.50)"
      mdc-select-fill-color: "var(--background-color-2)"
      mdc-theme-primary: "#7C9CFF"
      mdc-theme-on-primary: "#ffffff"
      paper-input-container-focus-color: "#7C9CFF"
      code-editor-background-color: "#0d1020"

      # ── Popups / dialogs ──────────────────────────────────────
      more-info-header-background: "var(--background-color-2)"
      paper-dialog-background-color: "var(--background-color)"
      mdc-dialog-scrim-color: "rgba(0,0,0,0.7)"
      mdc-dialog-box-shadow: "0 24px 48px rgba(0,0,0,0.8)"
      dialog-backdrop-filter: "blur(16px)"

      # ── Dashboard picker cards (transparent fix) ──────────────
      ha-card-background-dashboard-picker: "#0d1020"
      masonry-view-card-margin: "4px 4px"

      # ── Tables ───────────────────────────────────────────────
      table-row-background-color: "var(--background-color)"
      table-row-alternative-background-color: "var(--background-color-2)"

      # ── Badges ───────────────────────────────────────────────
      label-badge-background-color: "var(--background-color-2)"
      label-badge-text-color: "var(--text-color)"
      label-badge-red: "#F87171"
      label-badge-green: "#5EDCB8"
      label-badge-yellow: "#FFB26B"
      label-badge-blue: "#7C9CFF"
      label-badge-grey: "rgba(244,246,251,0.30)"

      # ── Radio buttons ─────────────────────────────────────────
      paper-radio-button-checked-color: "#7C9CFF"

      # ── Energy dashboard ──────────────────────────────────────
      energy-grid-consumption-color: "#7C9CFF"
      energy-grid-return-color: "#5EDCB8"
      energy-solar-color: "#FFB26B"
      energy-battery-in-color: "#C084FC"
      energy-battery-out-color: "#5EDCB8"
      energy-home-color: "#7C9CFF"

      # ── Scrollbar ─────────────────────────────────────────────
      scrollbar-thumb-color: "rgba(255,255,255,0.12)"

      # ── Neo custom tokens ─────────────────────────────────────
      neo-fill0: "rgba(255,255,255,0.02)"
      neo-fill1: "rgba(255,255,255,0.04)"
      neo-fill2: "rgba(255,255,255,0.055)"
      neo-line1: "rgba(255,255,255,0.06)"
      neo-line2: "rgba(255,255,255,0.08)"
      neo-line3: "rgba(255,255,255,0.10)"
      neo-line4: "rgba(255,255,255,0.12)"
      neo-line5: "rgba(255,255,255,0.14)"
      neo-line6: "rgba(255,255,255,0.16)"
      neo-text1: "#F4F6FB"
      neo-text2: "rgba(244,246,251,0.72)"
      neo-text3: "rgba(244,246,251,0.50)"
      neo-text4: "rgba(244,246,251,0.30)"
      neo-shadow1: "rgba(0,0,0,0.55)"
      neo-shadow2: "rgba(0,0,0,0.5)"
      neo-blur: "blur(24px) saturate(140%)"
      neo-radius: "24px"
      neo-font: "-apple-system, SF Pro Display, Inter, system-ui, sans-serif"
      neo-accent-blue: "#7C9CFF"
      neo-accent-amber: "#FFB26B"
      neo-accent-mint: "#5EDCB8"
      neo-accent-violet: "#C084FC"
      neo-accent-rose: "#F87171"

    light:
      # ── Base background variables ─────────────────────────────
      background-color: "#CBD4E4"
      background-color-2: "#DCE3EF"
      primary-background-color: "var(--background-color)"
      secondary-background-color: "var(--background-color-2)"

      # ── Lovelace background ───────────────────────────────────
      lovelace-background: >-
        radial-gradient(90% 70% at 15% 0%, rgba(110,140,255,0.16) 0%, rgba(214,221,235,0) 55%),
        radial-gradient(70% 55% at 100% 100%, rgba(255,170,120,0.12) 0%, rgba(214,221,235,0) 60%),
        linear-gradient(180deg, #DCE3EF 0%, #CBD4E4 100%)

      # ── Primary / accent ──────────────────────────────────────
      primary-color: "#5B7FE8"
      accent-color: "#5B7FE8"

      # ── Text ─────────────────────────────────────────────────
      text-color: "#0F1626"
      primary-text-color: "var(--text-color)"
      text-primary-color: "var(--text-color)"
      secondary-text-color: "rgba(15,22,38,0.62)"
      disabled-text-color: "rgba(15,22,38,0.26)"
      sidebar-text-color: "var(--text-color)"

      # ── Cards ─────────────────────────────────────────────────
      ha-card-background: "rgba(255,255,255,0.92)"
      card-background-color: "var(--ha-card-background)"
      ha-card-border-color: "rgba(28,40,72,0.11)"
      ha-card-border-width: "1px"
      ha-card-border-radius: "24px"
      ha-card-box-shadow: "0 18px 40px -16px rgba(40,55,95,0.22)"
      divider-color: "rgba(28,40,72,0.11)"
      grid-card-gap: "16px"

      # ── Sidebar ───────────────────────────────────────────────
      sidebar-background-color: "#e2e8f4"
      sidebar-icon-color: "rgba(15,22,38,0.42)"
      sidebar-selected-icon-color: "#5B7FE8"
      sidebar-selected-text-color: "var(--text-color)"
      paper-listbox-background-color: "var(--sidebar-background-color)"

      # ── Header ───────────────────────────────────────────────
      app-header-background-color: "rgba(203,212,228,0.92)"
      app-header-text-color: "var(--text-color)"
      app-header-selection-bar-color: "#5B7FE8"

      # ── Switches ─────────────────────────────────────────────
      switch-checked-color: "#5B7FE8"
      switch-unchecked-color: "rgba(28,40,72,0.18)"
      switch-checked-button-color: "#ffffff"
      mdc-theme-primary: "#5B7FE8"

      # ── Sliders ──────────────────────────────────────────────
      slider-color: "#5B7FE8"
      paper-slider-knob-color: "#5B7FE8"
      paper-slider-active-color: "#5B7FE8"
      paper-slider-container-color: "rgba(28,40,72,0.13)"

      # ── Inputs ───────────────────────────────────────────────
      input-fill-color: "var(--background-color-2)"
      input-ink-color: "var(--text-color)"
      input-idle-line-color: "rgba(28,40,72,0.15)"
      input-hover-line-color: "#5B7FE8"
      mdc-text-field-fill-color: "var(--background-color-2)"

      # ── Popups ───────────────────────────────────────────────
      more-info-header-background: "var(--background-color-2)"
      paper-dialog-background-color: "var(--background-color)"

      # ── Tables ───────────────────────────────────────────────
      table-row-background-color: "var(--background-color)"
      table-row-alternative-background-color: "var(--background-color-2)"

      # ── Energy ───────────────────────────────────────────────
      energy-grid-consumption-color: "#5B7FE8"
      energy-grid-return-color: "#2BAF8A"
      energy-solar-color: "#E8943A"

      # ── Neo tokens ────────────────────────────────────────────
      neo-fill0: "rgba(255,255,255,0.97)"
      neo-fill1: "rgba(255,255,255,0.99)"
      neo-fill2: "rgba(255,255,255,1)"
      neo-line1: "rgba(28,40,72,0.08)"
      neo-line2: "rgba(28,40,72,0.11)"
      neo-line3: "rgba(28,40,72,0.13)"
      neo-line4: "rgba(28,40,72,0.15)"
      neo-line5: "rgba(28,40,72,0.18)"
      neo-line6: "rgba(28,40,72,0.22)"
      neo-text1: "#0F1626"
      neo-text2: "rgba(15,22,38,0.62)"
      neo-text3: "rgba(15,22,38,0.42)"
      neo-text4: "rgba(15,22,38,0.26)"
      neo-shadow1: "rgba(40,55,95,0.22)"
      neo-shadow2: "rgba(40,55,95,0.16)"
      neo-blur: "none"
      neo-radius: "24px"
      neo-accent-blue: "#5B7FE8"
      neo-accent-amber: "#E8943A"
      neo-accent-mint: "#2BAF8A"
      neo-accent-violet: "#9B59D9"
      neo-accent-rose: "#E05555"
