name: Build beta bundle

# Manual helper to rebuild the committed bundle (neo-dashboard.js) from src/.
# Triggered on demand only (workflow_dispatch) — this keeps it generic (no
# hardcoded beta version / branch) and avoids a commit loop, since the job
# pushes a commit back to the branch it runs on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Commit built bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neo-dashboard.js
          if git diff --cached --quiet; then
            echo "No build changes to commit."
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          git commit -m "Build beta ${VERSION}"
          git push
