name: CI

# push nur auf main — PR-Branches sind über den pull_request-Trigger abgedeckt
# (beide zusammen ließen jeden PR-Commit doppelt laufen).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Volle Historie: der Store-Validator prüft die gepinnten @<ref>-Inhalte
          # der Katalog-URLs gegen den lokalen Stand (git show <ref>:<pfad>).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      # Das Root-Bundle ist ein bewusst committetes Build-Artefakt (HACS liefert
      # es direkt aus). Schlägt fehl, wenn src/ geändert wurde, ohne das Bundle
      # neu zu bauen und mitzucommitten.
      - name: Check bundle is up to date
        run: |
          if ! git diff --exit-code neo-dashboard.js; then
            echo "::error::neo-dashboard.js ist veraltet — 'npm run build' ausführen und das Bundle mitcommitten."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Validate store catalog
        run: node scripts/validate-store.mjs

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
